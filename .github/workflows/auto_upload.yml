name: Auto Generate and Upload Jewelry Shorts

on:
  schedule:
    # বাংলাদেশ সময় (BST) সকাল ৯:১২, ১১:১২, ১:১২, ৩:১২, ৫:১২, ৭:১২, ৯:১২ টায় রান হবে
    # (UTC 3:12, 5:12, 7:12, 9:12, 11:12, 13:12, 15:12)
    - cron: '12 3,5,7,9,11,13,15 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python upload_shorts.py
